version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is not yet supported by typescript-eslint (see docs/decisions/0002).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node type definitions follow the Node major in .nvmrc, upgraded on purpose.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # NestJS packages must share a version, or the API fails to load them.
      nestjs:
        patterns:
          - "@nestjs/common"
          - "@nestjs/core"
          - "@nestjs/platform-express"
          - "@nestjs/testing"
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
