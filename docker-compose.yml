# Local development services. Ports bind to 127.0.0.1 only.
# Credentials here are for local development and never used anywhere else.
name: releaselens

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: releaselens
      POSTGRES_PASSWORD: releaselens
      POSTGRES_DB: releaselens
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaselens -d releaselens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches outgoing email locally; web UI on http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
