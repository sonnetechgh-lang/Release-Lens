packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks dependency install scripts unless they are listed here.
allowBuilds:
  "@prisma/engines": true
  prisma: true
  "@swc/core": true
  # Not needed: telemetry and optional native speedups (pure-JS fallbacks are used).
  "@scarf/scarf": false
  cpu-features: false
  protobufjs: false
  ssh2: false
